name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build debug-signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK (signed with debug keystore)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/PrayerTracker-${GITHUB_REF_NAME}.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/PrayerTracker-${GITHUB_REF_NAME}.apk"
          asset="PrayerTracker-${GITHUB_REF_NAME}.apk"
          title="Prayer Tracker ${GITHUB_REF_NAME}"
          body="Debug-signed APK built by CI for tag ${GITHUB_REF_NAME}.
          
          Note: This APK is signed with the debug keystore and can be installed on any device for testing.
          For production releases, use a proper release keystore."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${apk}#${asset}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${apk}#${asset}" \
              --title "$title" --notes "$body"
          fi