# Keep GitHub Actions dependencies up to date
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # AGP/Kotlin/KSP must move together with the pinned toolchain; the
      # gradle wrapper version is intentionally fixed. Dependabot reports
      # these by their plugin id / wrapper name, not the module artifact.
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      - dependency-name: "org.jetbrains.kotlin.android"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
      - dependency-name: "com.google.devtools.ksp"
      - dependency-name: "gradle-wrapper"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"